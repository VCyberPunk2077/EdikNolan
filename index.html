<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Эдик и Кристина</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#241830;color:#fff}.app{min-height:100dvh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 10%,#705176,#241830 75%)}.game{width:min(100%,1000px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800;letter-spacing:.04em}header span{font-size:14px;color:#e7bdd4}.scene{position:relative;overflow:hidden;min-height:min(72vh,650px);border:4px solid #fff8;border-radius:24px;background:linear-gradient(#f7b7b4 0%,#fbd8bf 48%,#9dc48f 49%,#73a87c 100%);box-shadow:0 25px 70px #130b2280;display:flex;flex-direction:column;justify-content:flex-end}.scene.pond{background:linear-gradient(#a9dff1 0%,#e7c5d6 48%,#76b7c5 49%,#70a9a1 100%)}.scene.cafe{background:linear-gradient(#f4bc96 0%,#f8d9b6 50%,#b97772 51%,#8d5d69 100%)}.scene.rain{background:linear-gradient(#8597b6 0%,#c3bfd0 49%,#778d94 50%,#637c83 100%)}.scene.festival{background:linear-gradient(#514772 0%,#a66c91 49%,#596b70 50%,#6d6671 100%)}.scene.festival .sun{background:#ffe6b3;box-shadow:0 0 50px #fff5}.scene.moscow{background:linear-gradient(#ec9baa 0%,#ffd4b9 49%,#a88492 50%,#786574 100%)}.scene.moscow .hill{background:#8e788f;clip-path:polygon(0 60%,10% 60%,10% 35%,13% 35%,13% 10%,16% 35%,19% 35%,19% 60%,30% 60%,30% 25%,35% 25%,35% 60%,55% 60%,55% 40%,59% 40%,61% 5%,63% 40%,67% 40%,67% 60%,80% 60%,80% 30%,87% 30%,87% 60%,100% 60%,100% 100%,0 100%)}.sun{position:absolute;top:8%;right:12%;width:110px;aspect-ratio:1;border-radius:50%;background:#ffe9a7;box-shadow:0 0 70px #ffeab8}.hill{position:absolute;bottom:28%;width:120%;height:25%;left:-10%;border-radius:50%;background:#83b584}.dialogue{position:relative;margin:18px;background:#fffaf3;color:#38283d;border-radius:20px;padding:20px 24px;min-height:170px;box-shadow:0 5px 0 #4e304933}.speaker{color:#bf487d;font-weight:900;text-transform:uppercase;font-size:14px;letter-spacing:.1em}.text{font-size:clamp(17px,2vw,21px);line-height:1.45;margin:8px 0 16px}.choices{display:flex;flex-wrap:wrap;gap:10px}button{border:0;border-radius:12px;background:#704c94;color:white;font:700 15px system-ui;padding:12px 17px;cursor:pointer}button:hover{background:#9169b3}button:focus-visible{outline:3px solid #f4af50;outline-offset:3px}.hint{font-size:13px;color:#dec7df;margin:12px 4px}@media(max-width:600px){.app{padding:8px}.scene{min-height:78dvh}.dialogue{margin:10px;padding:16px;min-height:220px}.choices button{width:100%;text-align:left}.text{font-size:17px}.sun{width:70px}header{font-size:15px}}

.scene.playing{min-height:max(min(72vh,650px),520px)}
.rhythm{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;overflow:auto;padding:16px 12px;background:#201633}
.rhythm.active{display:flex}
.rhythm h2{margin:0;font-size:clamp(21px,4vw,28px)}
.track,.rhythmGuide{margin:4px 0;text-align:center;color:#e7cce9;font-size:14px}
.rhythm .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.rhythm button{padding:9px 12px}
.rhythm button:disabled{opacity:.55;cursor:default}
.rhythm .continue{background:#493757}
.rhythmHud{width:min(100%,400px);display:grid;gap:5px;margin-top:4px;font-size:14px}
.rhythmReadout{display:flex;justify-content:space-between;gap:8px;min-height:20px}
.rhythmHud progress{width:100%;height:7px;accent-color:#f4c271}
.rhythmTrack{width:min(100%,400px)}
.lanes{--hit-y:88%;height:clamp(160px,32dvh,285px);position:relative;overflow:hidden;border-radius:14px 14px 6px 6px;background:repeating-linear-gradient(90deg,#fff0 0,#fff0 calc(25% - 1px),#ffffff25 calc(25% - 1px),#ffffff25 25%),linear-gradient(#2c2045,#39274f);margin:6px 0}
.hitLine{position:absolute;z-index:1;top:var(--hit-y);width:100%;height:3px;background:#fff0cb;box-shadow:0 0 12px #ffeab5}
.notes{position:absolute;inset:0}
.note{position:absolute;width:17%;height:16px;border-radius:8px;transform:translateY(-50%);background:var(--lane-color);box-shadow:0 0 10px var(--lane-color)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.keys button{background:#342447;border-bottom:3px solid var(--lane-color);touch-action:manipulation;font-size:18px;padding:8px}
.keys button.pressed{background:var(--lane-color);color:#201633}
.lane-0{--lane-color:#f5adcb}.lane-1{--lane-color:#d1b6ff}.lane-2{--lane-color:#ffce78}.lane-3{--lane-color:#a5e0c5}
.rhythmFeedback{min-height:22px;margin:5px 0 0;text-align:center;font-weight:800;color:#ffdc83}
.rhythmFeedback[data-judgment="miss"]{color:#f7acbb}
@media(max-width:600px){.scene.playing{min-height:max(78dvh,515px)}.rhythm{padding:10px 8px}.rhythm .actions{margin:5px 0}.rhythmGuide{font-size:13px}}

.scene.battle-screen{min-height:0}
.battle-screen .dialogue,.battle-screen>.characters{display:none}
.battle{display:none;position:relative;z-index:6;padding:clamp(8px,2.5vw,22px);gap:8px;background:#0d1829;color:#f4f5ff;font:700 15px/1.4 ui-monospace,monospace}
.battle.active{display:grid}
.battleFrame{border:2px solid #b5c9ec;border-radius:6px;background:linear-gradient(150deg,#203c64,#12253f 75%);box-shadow:inset 0 0 0 2px #0a172c,0 2px 0 #050c17}
.battleHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 13px}
.battle h2,.battle h3,.battle p{margin:0}
.battle h2{font-size:clamp(15px,3.5vw,22px)}
.battle h3{font-size:13px;color:#c0d6f4}
.battle button{border-radius:3px;color:inherit;background:#193353;font:inherit}
.battle button:hover,.battle button:focus-visible{background:#365983}
.battle button:focus-visible{outline:2px solid #fad78c;outline-offset:-2px}
.battleSound{padding:7px 9px;white-space:nowrap;font-size:12px!important}
.battleStage{position:relative;isolation:isolate;display:grid;justify-items:center;align-content:end;min-height:clamp(180px,31vh,275px);padding:12px;overflow:hidden;background:linear-gradient(180deg,#151e3b,#505071 65%,#263039 65%,#131b2a)}
.battleStage::before{content:"";position:absolute;z-index:-1;inset:11% 0 26%;background:repeating-linear-gradient(90deg,transparent 0 17px,#ebc57955 18px 21px,transparent 22px 34px),linear-gradient(#23263c,#262c46);clip-path:polygon(0 29%,9% 29%,9% 0,20% 0,20% 34%,29% 34%,29% 55%,39% 55%,39% 39%,48% 39%,48% 61%,62% 61%,62% 31%,74% 31%,74% 4%,87% 4%,87% 33%,94% 33%,94% 19%,100% 19%,100% 100%,0 100%)}
.battleStage::after{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 50% 80%,#edbb7b42,transparent 47%),repeating-linear-gradient(0deg,#060d1614 0 1px,transparent 1px 4px);pointer-events:none}
.battleSprite{position:relative;width:106px;height:120px;margin:2px 0 10px;filter:drop-shadow(0 5px 0 #060b18aa);transition:transform .18s,filter .18s}
.battleSprite::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#292b47 0 29%,#515676 29% 43%,#3c3f5b 43% 75%,#22273e 75%);clip-path:polygon(34% 0,66% 0,66% 6%,76% 6%,76% 20%,83% 20%,83% 45%,93% 45%,93% 60%,100% 60%,100% 89%,85% 89%,85% 100%,15% 100%,15% 89%,0 89%,0 60%,7% 60%,7% 45%,17% 45%,17% 20%,24% 20%,24% 6%,34% 6%)}
.battleSprite::after{content:"";position:absolute;inset:25% 25% 39%;background:linear-gradient(#151b31 0 18%,#b09caa 18% 40%,#282537 40% 59%,#a0727b 59% 72%,#171e32 72%);clip-path:polygon(7% 0,93% 0,93% 63%,81% 63%,81% 82%,65% 82%,65% 100%,35% 100%,35% 82%,19% 82%,19% 63%,7% 63%)}
.battle[data-phase="2"] .battleSprite{transform:scale(1.07);filter:drop-shadow(0 0 13px #f56a75a6)}
.battleEnemyInfo{width:min(100%,285px);padding:6px 11px;background:#101a2be8;border:1px solid #7885a6;border-radius:3px}
.battleReadout{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.battleReadout small{white-space:nowrap;color:#dbe8ff;font-size:12px}
.battle progress{display:block;width:100%;height:6px;margin-top:5px;accent-color:#7ae7bf}
.battle progress.enemyBar{accent-color:#ff8b9f}
.battleLog{padding:10px 13px;min-height:74px}
.battleIntent{display:block;color:#ffda95;font-size:13px;margin-bottom:3px}
.battleIntent[hidden]{display:none}
.battleControls{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:8px}
.battlePanel{min-width:0;padding:9px}
.battleMoves,.battleEnd{display:grid;gap:3px;margin-top:6px}
.battleMoves[hidden],.battleEnd[hidden]{display:none}
.battleMoves button,.battleEnd button{display:grid;grid-template-columns:16px 1fr;align-items:center;text-align:left;min-height:33px;padding:5px 7px;line-height:1.2}
.battleMoves button::before,.battleEnd button::before{content:"›";color:#ffdc90;visibility:hidden}
.battleMoves button:focus-visible::before,.battleMoves button:hover::before,.battleEnd button:focus-visible::before,.battleEnd button:hover::before{visibility:visible}
.battleMoves button:disabled{color:#a8b7cb;background:#192c46;cursor:default}
.battleMoves button small{grid-column:2;font-weight:500;font-size:11px;color:#c9d9ef}
.battleParty h3{margin-bottom:10px}
.battleParty .battleReadout{margin-top:8px}
.battleParty p{margin-top:8px;color:#c9d9ef;font-size:12px}
@media(max-width:510px){.battle{font-size:13px;gap:6px}.battleControls{grid-template-columns:1fr}.battleParty{grid-row:1;display:grid;grid-template-columns:1fr 1fr;column-gap:12px}.battleParty h3{grid-column:1/-1;margin:0}.battleParty progress{grid-column:1}.battleParty .battleReadout{margin-top:4px}.battleParty p{margin-top:4px}.battleMoves{grid-template-columns:1fr 1fr}.battleMoves button{min-height:42px}.battleStage{min-height:174px}.battleSprite{height:98px;width:86px}}

header{gap:12px;align-items:flex-start}
header>div:first-child{padding-top:4px}
.chapter{text-align:right;min-width:0}
.chapter span{display:block;font-size:12px}
.chapter span[hidden]{display:none}
.chapter h1{font-size:clamp(15px,2.7vw,24px);font-weight:800;line-height:1.12;letter-spacing:0;margin:3px 0 1px;color:#fff}
.dialogue .text{white-space:pre-line}
.dialogue .choices button:focus-visible{outline-offset:3px}
@media(max-width:450px){header>div:first-child{max-width:115px}.chapter h1{font-size:16px}.chapter span{font-size:11px}}

.portraitEdik{background-position:left center}
.portraitKristina{background-position:right center}
.characters{position:relative;display:flex;flex:1;justify-content:center;align-items:flex-end;gap:clamp(18px,9vw,96px);padding:clamp(20px,5vh,42px) 12px 10px}
.person{width:min(38%,210px);margin:0;position:relative;text-align:center;transition:transform .35s}
.person .portrait{border:2px solid #fff9;border-radius:13px;box-shadow:0 12px 30px #2d1b3466}
.person figcaption{position:relative;display:inline-block;margin:-15px auto 0;padding:4px 14px;background:#fffaf3;color:#49344c;border-radius:18px;font-size:14px;font-weight:800;vertical-align:top}
.kiss .characters{gap:clamp(12px,4vw,38px)}
.kiss .person:first-child{transform:rotate(4deg)}
.kiss .person:last-child{transform:rotate(-4deg)}
.heart{display:none}
.kiss .heart{display:block;position:absolute;inset:6% 0 auto;text-align:center;color:#fa668b;text-shadow:0 1px 8px #58213f55;font-size:clamp(28px,6vw,58px);pointer-events:none}
.family{display:none}
.scene.final{min-height:0;background:radial-gradient(ellipse at 50% 10%,#f6dac8,#d8b0be 70%)}
.final>.characters,.final>.sun,.final>.hill{display:none}
.final>.family{position:relative;display:grid;justify-items:center;gap:clamp(10px,2vw,18px);padding:clamp(16px,4vw,36px) 10px 4px}
.familyParents{display:flex;align-items:center;gap:clamp(8px,2.8vw,22px);width:min(100%,254px);justify-content:center;color:#a53c65;font-size:clamp(20px,5vw,34px)}
.familyParents .portrait{width:min(40%,99px);border-radius:10px;border:2px solid #fffb;box-shadow:0 4px 12px #66264244}
.kids{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;width:min(100%,330px)}
.kids span{display:grid;place-items:center;min-width:0;padding:4px 0;background:#fff6;border-radius:9px;font:clamp(21px,6.5vw,38px)/1.15 system-ui}
.battlePartyTitle{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.battlePartyTitle h3{margin:0}
.battlePartyPortraits{display:flex;gap:3px;flex:none}
.battlePartyPortraits .portrait{width:24px;border-radius:3px;border:1px solid #b5c9ec}
.battle[data-phase="3"] .battleSprite{transform:scale(1.09);filter:drop-shadow(0 0 12px #f9b963bb)}
.battle[data-phase="3"] .battleStage{background:linear-gradient(180deg,#222344,#73556b 65%,#37313d 65%,#151c2a)}
@media(max-width:600px){.characters{gap:clamp(14px,5vw,44px);padding-top:20px}.person{width:min(39%,175px)}}
@media(max-width:510px){.battlePartyTitle{grid-column:1/-1;margin:0}}

.gameIdentity{display:grid;justify-items:start;gap:5px}
.ambientSound{padding:4px 8px;border:1px solid #ffffff52;background:#25182e85;font:600 11px/1.3 system-ui;white-space:nowrap}
.ambientSound:hover{background:#543965}
.ambientSound[hidden]{display:none}

const scenes = Object.fromEntries(chapters.flatMap((chapter, index) =>
  Object.entries(chapter.scenes).map(([id, scene]) => [id, {...scene, chapter: index}])
));
const story = {};
const chapterHeading = document.querySelector('#chapterTitle');
const chapterNumber = document.querySelector('#chapterNumber');
const storyPortraits = document.querySelector('.characters');
const battlePortraits = document.querySelector('.battlePartyPortraits');

function setPortraitMoods(portraits, [edik = 'neutral', kristina = 'neutral'] = []) {
  portraits.querySelector('.portraitEdik').dataset.expression = edik;
  portraits.querySelector('.portraitKristina').dataset.expression = kristina;
}
let currentChapter = -1;
const ambientAudio = document.querySelector('#ambientSong');
const ambientSound = document.querySelector('#ambientSound');
let ambientEnabled = true;

function renderAmbientSound() {
  const playing = !ambientAudio.paused;
  ambientSound.setAttribute('aria-pressed', String(playing));
  ambientSound.textContent = playing ? 'Выключить фон' : 'Включить фон';
}

function syncAmbientMusic(inStory) {
  ambientSound.hidden = !inStory;
  if (!inStory || !ambientEnabled) {
    ambientAudio.pause();
  } else if (ambientAudio.paused) {
    ambientAudio.play().catch(renderAmbientSound);
  }
  renderAmbientSound();
}

ambientAudio.addEventListener('playing', renderAmbientSound);
ambientAudio.addEventListener('pause', renderAmbientSound);
ambientSound.onclick = () => {
  ambientEnabled = ambientAudio.paused;
  syncAmbientMusic(true);
};

function setChapter(index) {
  if (currentChapter === index) return;
  currentChapter = index;
  const isEpilogue = index === chapters.length - 1;
  chapterHeading.textContent = chapters[index].title;
  chapterNumber.textContent = isEpilogue ? '' : `Глава ${index + 1} из ${chapters.length - 1}`;
  chapterNumber.hidden = isEpilogue;
}

function show(id, moveFocus = true) {
  if (id === 'start') {
    for (const key of Object.keys(story)) delete story[key];
  }
  if (id === 'rhythmGame') {
    syncAmbientMusic(false);
    setChapter(scenes.musicIntro.chapter);
    openRhythm();
    return;
  }
  if (id === 'battleGame') {
    syncAmbientMusic(false);
    setChapter(scenes.encounterIntro.chapter);
    openBattle();
    return;
  }
  if (id === 'city' || id === 'encounterIntro') prepareBattleMusic();

  const entry = scenes[id];
  setChapter(entry.chapter);
  setPortraitMoods(storyPortraits, typeof entry.mood === 'function' ? entry.mood(story) : entry.mood);
  scene.className = 'scene ' + (entry.style || '');
  if (moveFocus) syncAmbientMusic(true);
  document.querySelector('#speaker').textContent = entry.who;
  document.querySelector('#text').textContent = typeof entry.text === 'function' ? entry.text(story) : entry.text;
  const choices = document.querySelector('#choices');
  const options = typeof entry.choices === 'function' ? entry.choices(story) : entry.choices;
  choices.replaceChildren();
  for (const [label, next, changes] of options) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.onclick = () => {
      Object.assign(story, changes);
      show(next);
    };
    choices.appendChild(button);
  }
  if (moveFocus) choices.firstElementChild?.focus();
}

const battle = document.querySelector('#battle');
const battleAudio = document.querySelector('#battleSong');
const battleSound = document.querySelector('#battleSound');
const heroBar = document.querySelector('#heroBar');
const foeBar = document.querySelector('#foeBar');
const heroStat = document.querySelector('#heroStat');
const foeStat = document.querySelector('#foeStat');
const supportStat = document.querySelector('#supportStat');
const battleRound = document.querySelector('#battleRound');
const battleIntent = document.querySelector('#battleIntent');
const battleLog = document.querySelector('#battleLog');
const battleMoves = document.querySelector('#battleMoves');
const battleEnd = document.querySelector('#battleEnd');
const teamMove = document.querySelector('#teamMove');
const recoverMove = document.querySelector('#recoverMove');
const battleRetry = document.querySelector('#battleRetry');
const battleContinue = document.querySelector('#battleContinue');

const maxResolve = 160;
const maxPressure = 372;
const maxSupport = 3;
const maxRounds = 16;
const battlePhases = [
  {name: 'Во дворе', pressureFloor: 258, damageBonus: 0, pattern: ['quick', 'heavy', 'feint', 'quick']},
  {name: 'В проходе', pressureFloor: 132, damageBonus: 4, pattern: ['blockade', 'heavy', 'feint', 'quick', 'blockade']},
  {name: 'У ворот', pressureFloor: 0, damageBonus: 7, pattern: ['heavy', 'quick', 'blockade', 'feint', 'heavy']}
];
const enemyAttacks = {
  quick: {name: 'Быстрый выпад', damage: 28},
  heavy: {name: 'Сильный натиск', damage: 44},
  feint: {name: 'Финт', damage: 31},
  blockade: {name: 'Перехват у прохода', damage: 36}
};
const battleActions = {
  counter: {pressure: {quick: 37, heavy: 20, feint: 11, blockade: 13}, block: {quick: 16}, message: 'Эдик контратакует.'},
  guard: {pressure: {quick: 8, heavy: 15, feint: 4, blockade: 12}, block: {quick: 14, heavy: 40, blockade: 18}, support: 1, message: 'Эдик встаёт в защиту.'},
  rally: {pressure: {quick: 10, heavy: 10, feint: 24, blockade: 29}, block: {feint: 31, blockade: 29}, support: 1, message: 'Кристина подсказывает, куда отойти.'},
  team: {pressure: {quick: 49, heavy: 52, feint: 32, blockade: 55}, block: {quick: 12, heavy: 26, blockade: 32}, support: -2, message: 'Эдик и Кристина действуют вместе.'},
  recover: {pressure: {quick: 0, heavy: 0, feint: 0, blockade: 0}, block: {quick: 7, heavy: 7, feint: 7, blockade: 7}, heal: 42, message: 'Эдик переводит дыхание.'}
};
let battleState;
let battleMusicEnabled = true;

function currentAttack() {
  const {pattern} = battlePhases[battleState.phase - 1];
  return pattern[(battleState.round - battleState.phaseStart) % pattern.length];
}

function renderBattle() {
  heroBar.max = maxResolve;
  foeBar.max = maxPressure;
  heroBar.value = battleState.hero;
  foeBar.value = battleState.foe;
  heroStat.textContent = `${battleState.hero} / ${maxResolve}`;
  foeStat.textContent = `${battleState.foe} / ${maxPressure}`;
  supportStat.textContent = `${battleState.support} / ${maxSupport}`;
  battleRound.textContent = `Раунд ${battleState.round + 1} из ${maxRounds} · Фаза ${battleState.phase}/${battlePhases.length} · ${battlePhases[battleState.phase - 1].name}`;
  battle.dataset.phase = battleState.phase;
  const won = battleState.finished && battleState.foe === 0;
  const underPressure = battleState.phase > 1 || battleState.finished;
  const edikMood = won ? 'smile' : (underPressure ? 'concern' : 'neutral');
  setPortraitMoods(battlePortraits, [edikMood, won ? 'smile' : 'concern']);
  battleIntent.hidden = battleState.finished;
  if (!battleState.finished) battleIntent.textContent = 'Следующий ход противника · ' + enemyAttacks[currentAttack()].name;
  teamMove.disabled = battleState.support < 2;
  recoverMove.disabled = battleState.recovered;
}

function prepareBattleMusic() {
  if (battleAudio.hasAttribute('src')) return;
  battleAudio.preload = 'auto';
  battleAudio.src = battleAudio.dataset.track;
}

function renderBattleSound() {
  const playing = battleMusicEnabled && !battleAudio.paused;
  battleSound.setAttribute('aria-pressed', String(playing));
  battleSound.textContent = playing ? 'Выключить музыку' : 'Включить музыку';
}

function playBattleMusic() {
  prepareBattleMusic();
  battleAudio.play().catch(renderBattleSound);
  renderBattleSound();
}

function stopBattleMusic() {
  battleAudio.pause();
  battleAudio.currentTime = 0;
}

function openBattle() {
  battleState = {hero: maxResolve, foe: maxPressure, support: 0, round: 0, phase: 1, phaseStart: 0, recovered: false, finished: false};
  scene.className = 'scene moscow battle-screen';
  battle.classList.add('active');
  battleMoves.hidden = false;
  battleEnd.hidden = true;
  battleSound.hidden = false;
  battleLog.textContent = `Доберитесь от двора до освещённой площади за ${maxRounds} ходов. Следи за намерением преследователя и копи очки поддержки.`;
  renderBattle();
  if (battleMusicEnabled) playBattleMusic();
  else renderBattleSound();
  battleMoves.querySelector('button').focus();
}

function finishBattle(won, lastTurn) {
  battleState.finished = true;
  stopBattleMusic();
  battleSound.hidden = true;
  battleMoves.hidden = true;
  battleEnd.hidden = false;
  const result = won ? 'Преследователь отступил. Путь к площади свободен.' : 'Кристина нажала SOS, и вы отошли к охране.';
  battleLog.textContent = `${lastTurn} ${result}`;
  battleContinue.textContent = won ? 'Продолжить прогулку' : 'Продолжить с охраной';
  renderBattle();
  battleContinue.focus();
}

function battleTurn(move) {
  const action = battleActions[move];
  if (battleState.finished || !action || (move === 'team' && teamMove.disabled) || (move === 'recover' && recoverMove.disabled)) return;

  const attack = currentAttack();
  const phase = battlePhases[battleState.phase - 1];
  const pressure = Math.min(action.pressure[attack], battleState.foe - phase.pressureFloor);
  battleState.foe -= pressure;
  battleState.support = Math.min(maxSupport, battleState.support + (action.support ?? 0));
  let summary = action.message + (pressure ? ` Натиск −${pressure}.` : '');
  if (battleState.foe === 0) {
    finishBattle(true, summary);
    return;
  }

  if (action.heal) {
    battleState.recovered = true;
    const healed = Math.min(action.heal, maxResolve - battleState.hero);
    battleState.hero += healed;
    summary += ` Решимость +${healed}.`;
  }

  const incoming = enemyAttacks[attack].damage + phase.damageBonus;
  const damage = Math.max(0, incoming - (action.block[attack] ?? 0));
  battleState.hero = Math.max(0, battleState.hero - damage);
  summary += damage ? ` Решимость −${damage}.` : ' Вы устояли.';
  if (battleState.hero === 0 || battleState.round + 1 === maxRounds) {
    finishBattle(false, summary);
    return;
  }

  battleState.round++;
  if (battleState.foe === phase.pressureFloor) {
    battleState.phase++;
    battleState.phaseStart = battleState.round;
    summary += battleState.phase === 2
      ? ' Вы добрались до прохода. Преследователь пытается вас обойти.'
      : ' Впереди ворота и свет площади. Осталось пройти последний участок.';
  }
  battleLog.textContent = summary;
  renderBattle();
}

battleAudio.addEventListener('playing', renderBattleSound);
battleAudio.addEventListener('pause', renderBattleSound);
battleSound.onclick = () => {
  battleMusicEnabled = battleAudio.paused;
  if (battleMusicEnabled) playBattleMusic();
  else battleAudio.pause();
  renderBattleSound();
};
battleMoves.addEventListener('click', event => {
  const button = event.target.closest('[data-move]');
  if (!button) return;
  battleTurn(button.dataset.move);
  if (!battleState.finished && battleMusicEnabled && battleAudio.paused) playBattleMusic();
  if (button.disabled && !battleState.finished) battleMoves.querySelector('button').focus();
});
battleMoves.addEventListener('keydown', event => {
  if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
  const commands = [...battleMoves.querySelectorAll('button:enabled')];
  const index = commands.indexOf(document.activeElement);
  const direction = event.key === 'ArrowDown' ? 1 : -1;
  event.preventDefault();
  commands[(index + direction + commands.length) % commands.length].focus();
});
battleRetry.onclick = openBattle;
battleContinue.onclick = () => {
  battle.classList.remove('active');
  show(battleState.foe === 0 ? 'battleAfter' : 'battleAfterFail');
};

const audio = document.querySelector('#song');
const scene = document.querySelector('#scene');
const rhythm = document.querySelector('#rhythm');
const lanes = document.querySelector('#lanes');
const status = document.querySelector('#rhythmStatus');
const part = document.querySelector('#rhythmPart');
const progress = document.querySelector('#songProgress');
const feedback = document.querySelector('#rhythmFeedback');
const playButton = document.querySelector('#playRhythm');
const continueButton = document.querySelector('#skipRhythm');
const keys = Array.from(document.querySelectorAll('[data-key]'));

// Eighth-note grid measured from the bundled recording. Digits identify lanes.
const stepSeconds = 30 / 152.45;
const firstBeat = .004;
const hitWindow = .125;
const perfectWindow = .060;
const travelTime = 1.65;
const phrases = [
  '................', '0...1.2.....3...', '1...2.3...0.1...', '0...1.2...3.2...',
  '0.1.2.30.2..1..3', '1.2.3.10..2.3...',
  '0.2.1.30.1..2..3', '1...2.31..0.3.2.',
  '0.1.3.20.3..1..2', '3.1.0.23..2.1...',
  '2.0.3.10.3..2..1', '0.2.1.32..0.3...',
  '0.1.2.30.2.13..0', '2.3.1.02.3.10..2',
  '1.0.2.31.2.30..1', '3.2.0.13.1.02..3',
  '0...2.1...3.1...', '2...3.0...1.2...',
  '1.3.2.01..3.2..0', '2.0.3.12..1.3...',
  '0.2.1.30.1.23..0', '1.3.0.21.3.20..1',
  '3.2.0.13.0.21..3', '2.1.3.02.1.30..2',
  '0.1.2.30.213...0', '1.2.0.31.203...1',
  '2.0.3.12.031...2', '3.1.0.23.102...3',
  '0.2.1.30.2.13..0', '2.3.1.02.3.10..2',
  '0...1.2...3.0...'
];
const chart = phrases.flatMap((phrase, bar) => Array.from(phrase).flatMap((lane, offset) =>
  lane === '.' ? [] : [{time: firstBeat + (bar * 16 + offset) * stepSeconds, lane: Number(lane)}]
));
const sections = [
  [0, 'Вступление'], [4, 'Первый куплет'], [12, 'Припев'],
  [16, 'Передышка'], [20, 'Снова в ритме'], [24, 'Финал']
].map(([bar, label]) => ({time: firstBeat + bar * 16 * stepSeconds, label}));

const run = {
  phase: 'ready', lastAttempt: 0, frame: 0, cursor: 0, outcomes: [],
  strikes: 0, perfect: 0, good: 0, combo: 0, best: 0,
  judgmentExpires: 0, result: null
};

function openRhythm() {
  run.phase = 'ready';
  run.result = null;
  scene.classList.add('playing');
  rhythm.classList.add('active');
  playButton.disabled = false;
  playButton.textContent = 'Начать выступление';
  continueButton.textContent = 'Пропустить выступление';
  part.textContent = 'Готов к выходу?';
  status.textContent = chart.length + ' нот';
  feedback.textContent = '';
  progress.value = 0;
  playButton.focus();
}

function stopRhythm() {
  run.lastAttempt++;
  cancelAnimationFrame(run.frame);
  audio.pause();
  lanes.replaceChildren();
  keys.forEach(button => button.classList.remove('pressed'));
}

playButton.onclick = async () => {
  stopRhythm();
  const attempt = run.lastAttempt;
  Object.assign(run, {
    phase: 'loading', result: null, cursor: 0, outcomes: [], strikes: 0,
    perfect: 0, good: 0, combo: 0, best: 0, judgmentExpires: 0
  });
  playButton.disabled = true;
  continueButton.textContent = 'Завершить выступление';
  progress.value = 0;
  part.textContent = 'Подготовка…';
  status.textContent = '';
  feedback.textContent = '';

  try {
    audio.currentTime = 0;
    await audio.play();
  } catch {
    if (attempt === run.lastAttempt) {
      run.phase = 'ready';
      part.textContent = 'Не удалось запустить песню';
      feedback.textContent = 'Попробуй начать ещё раз.';
      playButton.disabled = false;
      continueButton.textContent = 'Пропустить выступление';
    }
    return;
  }

  if (attempt !== run.lastAttempt) return;
  run.phase = 'playing';
  if (Number.isFinite(audio.duration)) progress.max = audio.duration;
  drawFrame();
};

function judge(index, outcome, time) {
  run.outcomes[index] = outcome;
  if (outcome === 'miss') {
    run.combo = 0;
  } else {
    run[outcome]++;
    run.combo++;
    run.best = Math.max(run.best, run.combo);
  }
  showJudgment(outcome, time);
}

function showJudgment(outcome, time) {
  feedback.dataset.judgment = outcome;
  feedback.textContent = {perfect: 'Точно!', good: 'В ритм!', miss: 'Мимо'}[outcome];
  run.judgmentExpires = time + .34;
}

function advanceNotes(time) {
  while (run.cursor < chart.length && chart[run.cursor].time + hitWindow < time) {
    if (!run.outcomes[run.cursor]) judge(run.cursor, 'miss', time);
    run.cursor++;
  }
}

function drawFrame() {
  if (run.phase !== 'playing') return;
  const time = audio.currentTime;
  advanceNotes(time);
  progress.value = time;
  part.textContent = sections.findLast(section => section.time <= time)?.label || 'Вступление';
  status.textContent = (run.perfect + run.good) + ' / ' + chart.length + ' · серия ' + run.combo;
  if (time > run.judgmentExpires) feedback.textContent = '';

  const visible = document.createDocumentFragment();
  for (let i = run.cursor; i < chart.length && chart[i].time <= time + travelTime; i++) {
    if (run.outcomes[i]) continue;
    const note = chart[i];
    const element = document.createElement('div');
    element.className = 'note lane-' + note.lane;
    element.style.left = (note.lane * 25 + 4) + '%';
    element.style.top = (88 * (1 - (note.time - time) / travelTime)) + '%';
    visible.appendChild(element);
  }
  lanes.replaceChildren(visible);
  run.frame = requestAnimationFrame(drawFrame);
}

function hit(lane) {
  if (run.phase !== 'playing') return;
  const time = audio.currentTime;
  advanceNotes(time);
  let closest = -1;
  let distance = hitWindow;
  for (let i = run.cursor; i < chart.length && chart[i].time <= time + hitWindow; i++) {
    const delta = Math.abs(chart[i].time - time);
    if (chart[i].lane === lane && !run.outcomes[i] && delta <= distance) {
      closest = i;
      distance = delta;
    }
  }
  if (closest >= 0) {
    judge(closest, distance <= perfectWindow ? 'perfect' : 'good', time);
  } else if (time >= chart[0].time - hitWindow && time <= chart.at(-1).time + hitWindow) {
    run.strikes++;
    run.combo = 0;
    showJudgment('miss', time);
  }
}

function getResult() {
  const hits = run.perfect + run.good;
  return {
    hits, best: run.best,
    accuracy: Math.round(100 * hits / (chart.length + run.strikes))
  };
}

audio.addEventListener('ended', () => {
  if (run.phase !== 'playing') return;
  advanceNotes(audio.currentTime);
  run.result = getResult();
  stopRhythm();
  run.phase = 'finished';
  progress.value = progress.max;
  part.textContent = 'Выступление окончено';
  status.textContent = run.result.hits + ' / ' + chart.length + ' · ' + run.result.accuracy + '%';
  feedback.textContent = 'Лучшая серия: ' + run.result.best + ' · точных: ' + run.perfect + (run.strikes ? ' · лишних нажатий: ' + run.strikes : '');
  feedback.dataset.judgment = 'perfect';
  playButton.disabled = false;
  playButton.textContent = 'Сыграть ещё раз';
  continueButton.textContent = 'Услышать Кристину';
  continueButton.focus();
});

audio.addEventListener('error', () => {
  if (run.phase !== 'playing') return;
  stopRhythm();
  run.phase = 'ready';
  feedback.textContent = 'Звук прервался. Попробуй начать ещё раз.';
  playButton.disabled = false;
  continueButton.textContent = 'Пропустить выступление';
});

const keyboardLanes = {KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3};
keys.forEach((button, lane) => {
  button.addEventListener('pointerdown', () => {
    button.classList.add('pressed');
    hit(lane);
  });
  for (const event of ['pointerup', 'pointerleave', 'pointercancel']) {
    button.addEventListener(event, () => button.classList.remove('pressed'));
  }
  button.addEventListener('click', event => {
    if (event.detail === 0) hit(lane);
  });
});
document.addEventListener('keydown', event => {
  if (run.phase !== 'playing' || !Object.hasOwn(keyboardLanes, event.code)) return;
  event.preventDefault();
  if (event.repeat) return;
  const lane = keyboardLanes[event.code];
  keys[lane].classList.add('pressed');
  hit(lane);
});
document.addEventListener('keyup', event => {
  if (Object.hasOwn(keyboardLanes, event.code)) keys[keyboardLanes[event.code]].classList.remove('pressed');
});
window.addEventListener('blur', () => keys.forEach(button => button.classList.remove('pressed')));

function reactToResult(result) {
  if (!result) return {performance: 'skip', musicText: ''};

  const stat = `Ты поймал ${result.hits} из ${chart.length} нот.`
    + (result.best ? ` Лучшая серия — ${result.best}.` : '');
  if (result.accuracy >= 90) return {
    performance: 'high',
    musicText: `${stat} На припеве весь первый ряд отбивал ритм на коленях. Я хотела снять, как ты кланяешься, и сняла собственный палец. Придётся поверить мне на слово.`
  };
  if (result.accuracy >= 65) return {
    performance: 'steady',
    musicText: `${stat} В начале я считала про себя, потом ты сам поймал темп. К концу я уже подпевала. Звукорежиссёр обещал сохранить и твою дорожку.`
  };
  return {
    performance: 'rough',
    musicText: `${stat} Первый куплет у вас с музыкой разошёлся в показаниях. А слышал, как зал подхватил ритм? Я тоже хлопала. Если захочешь повторить, буду отбивать счёт прямо у микрофона.`
  };
}

continueButton.onclick = () => {
  const result = run.result ?? (run.phase === 'playing' && audio.currentTime > chart[0].time ? getResult() : null);
  stopRhythm();
  run.phase = 'ready';
  rhythm.classList.remove('active');
  scene.classList.remove('playing');
  Object.assign(story, reactToResult(result));
  show('musicResult');
};
show('start', false);
</script></body></html>
